<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Atlas board</title>
<style>
.atlas-board{--bw-light-surface:#fff;--bw-light-surface-muted:#f4f6f8;--bw-light-text:#1d2935;--bw-light-muted:#526170;--bw-light-border:#d8e0e7;--bw-light-accent:#365f88;--bw-light-shadow:0 8px 22px rgba(20,37,52,.08);--bw-surface:var(--hatch-widget-surface,var(--bw-light-surface));--bw-surface-muted:var(--hatch-widget-surface-muted,var(--bw-light-surface-muted));--bw-text:var(--hatch-widget-text,var(--bw-light-text));--bw-muted:var(--hatch-widget-muted,var(--bw-light-muted));--bw-border:var(--hatch-widget-border,var(--bw-light-border));--bw-accent:var(--hatch-widget-accent,var(--bw-light-accent));--bw-shadow:var(--hatch-widget-shadow,var(--bw-light-shadow));box-sizing:border-box;width:100%;max-width:100%;min-width:0;padding:.4rem;color:var(--bw-text);font-family:var(--hatch-widget-font,system-ui,-apple-system,"Segoe UI",sans-serif);line-height:1.45}
.atlas-board *{box-sizing:border-box;min-width:0}
@media(prefers-color-scheme:dark){.atlas-board{--bw-light-surface:#151c25;--bw-light-surface-muted:#1f2935;--bw-light-text:#edf2f7;--bw-light-muted:#aab9c7;--bw-light-border:#34414f;--bw-light-accent:#8eb8ed;--bw-light-shadow:0 8px 22px rgba(0,0,0,.22)}}
:root[data-theme=dark] .atlas-board{--bw-light-surface:#151c25;--bw-light-surface-muted:#1f2935;--bw-light-text:#edf2f7;--bw-light-muted:#aab9c7;--bw-light-border:#34414f;--bw-light-accent:#8eb8ed;--bw-light-shadow:0 8px 22px rgba(0,0,0,.22)}
:root[data-theme=light] .atlas-board{--bw-light-surface:#fff;--bw-light-surface-muted:#f4f6f8;--bw-light-text:#1d2935;--bw-light-muted:#526170;--bw-light-border:#d8e0e7;--bw-light-accent:#365f88;--bw-light-shadow:0 8px 22px rgba(20,37,52,.08)}
.atlas-board .board-heading{display:flex;align-items:end;justify-content:space-between;gap:.65rem;flex-wrap:wrap;margin:0 0 1rem;padding:0 0 .8rem;border-bottom:1px solid var(--bw-border)}
.atlas-board .board-eyebrow{display:block;margin:0 0 .2rem;color:var(--bw-muted);font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.atlas-board h1{margin:0;font-size:clamp(1.2rem,2.5vw,1.65rem);line-height:1.16;letter-spacing:-.035em;font-weight:720;overflow-wrap:anywhere}
.atlas-board .board-total{color:var(--bw-muted);font-size:.81rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.atlas-board .board-note{margin:.15rem 0 .6rem;color:var(--bw-muted);font-size:.8rem;overflow-wrap:anywhere}
.atlas-board .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14.4rem),1fr));align-items:start;gap:.65rem;width:100%;max-width:100%}
.atlas-board .lane{padding:.55rem;border:1px solid var(--bw-border);border-radius:12px;background:var(--bw-surface-muted);min-width:0}
.atlas-board .lane-head{display:flex;align-items:center;justify-content:space-between;gap:.45rem;padding:.18rem .22rem .55rem;border-bottom:1px solid var(--bw-border)}
.atlas-board h2{margin:0;font-size:.76rem;font-weight:700;line-height:1.25;letter-spacing:.055em;text-transform:uppercase;overflow-wrap:anywhere}
.atlas-board .lane-count{display:inline-block;min-width:1.45rem;padding:.08rem .35rem;border:1px solid var(--bw-border);border-radius:999px;color:var(--bw-muted);text-align:center;font-size:.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.atlas-board .lane-list{display:grid;gap:.4rem;padding-top:.5rem}
.atlas-board .lane-empty{margin:.28rem .2rem .45rem;color:var(--bw-muted);font-size:.76rem}
.atlas-board .card{display:block;margin:0;border:1px solid var(--bw-border);border-radius:9px;background:var(--bw-surface);box-shadow:var(--bw-shadow);overflow:hidden}
.atlas-board .card[open]{border-color:var(--bw-accent)}
.atlas-board .card summary{display:block;padding:.65rem .7rem;cursor:pointer;list-style:none;position:relative}
.atlas-board .card summary::-webkit-details-marker{display:none}
.atlas-board .card summary:focus-visible{outline:2px solid var(--bw-accent);outline-offset:-3px;border-radius:8px}
.atlas-board .card summary::after{content:"";position:absolute;right:.78rem;top:.84rem;width:.36rem;height:.36rem;border-right:1.5px solid var(--bw-muted);border-bottom:1.5px solid var(--bw-muted);transform:rotate(45deg)}
.atlas-board .card[open] summary::after{transform:rotate(225deg);top:1rem}
.atlas-board .card-id{display:block;padding-right:.8rem;color:var(--bw-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;font-weight:650;letter-spacing:.02em;overflow-wrap:anywhere}
.atlas-board .card-title{display:block;margin:.28rem 0 .4rem;padding-right:.55rem;font-size:.87rem;font-weight:680;line-height:1.32;letter-spacing:-.012em;overflow-wrap:anywhere}
.atlas-board .card-meta,.atlas-board .card-pills,.atlas-board .card-blockers{display:flex;flex-wrap:wrap;align-items:center;gap:.27rem;min-width:0}
.atlas-board .card-meta{margin-bottom:.35rem;color:var(--bw-muted);font-size:.69rem}
.atlas-board .priority-dot{flex:none;width:.46rem;height:.46rem;border-radius:50%;background:#8793a0}
.atlas-board .priority-critical,.atlas-board .priority-high{background:#cf4d48}
.atlas-board .priority-medium{background:#c88a20}
.atlas-board .priority-low{background:#8793a0}
.atlas-board .pill{display:inline-block;max-width:100%;padding:.09rem .37rem;border:1px solid var(--bw-border);border-radius:999px;background:var(--bw-surface-muted);color:var(--bw-muted);font-size:.68rem;line-height:1.25;overflow-wrap:anywhere}
.atlas-board .pill-type{color:var(--bw-accent)}
.atlas-board .card-blockers{margin-top:.36rem}
.atlas-board .pill-blocked{color:#a83b37;border-color:#c88683}
@media(prefers-color-scheme:dark){.atlas-board .pill-blocked{color:#ffaaa5;border-color:#ad5f5a}}
:root[data-theme=dark] .atlas-board .pill-blocked{color:#ffaaa5;border-color:#ad5f5a}
.atlas-board .card-detail{padding:.7rem;border-top:1px solid var(--bw-border);font-size:.76rem;overflow-wrap:anywhere}
.atlas-board .card-detail h3{margin:.1rem 0 .26rem;color:var(--bw-muted);font-size:.68rem;line-height:1.3;font-weight:700;letter-spacing:.075em;text-transform:uppercase}
.atlas-board .card-detail p{margin:0 0 .65rem;white-space:pre-wrap}
.atlas-board .card-detail ul{margin:.05rem 0 .65rem;padding-left:1.12rem}
.atlas-board .card-detail li+li{margin-top:.25rem}
.atlas-board .card-detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15rem .55rem;margin:0}
.atlas-board .card-detail dt{color:var(--bw-muted)}
.atlas-board .card-detail dd{margin:0;overflow-wrap:anywhere}
@media(max-width:390px){.atlas-board .lanes{grid-template-columns:minmax(0,1fr)}.atlas-board .board-heading{align-items:start}}
@media(prefers-reduced-motion:reduce){.atlas-board *{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.atlas-board .view-switch{display:none;position:relative;margin:.1rem 0 .7rem;cursor:pointer}
.atlas-board .view-switch .view-toggle{position:absolute;width:1px;height:1px;margin:0;opacity:0}
.atlas-board .view-switch span{display:inline-block;padding:.3rem .75rem;border:1px solid var(--bw-border);border-radius:999px;background:var(--bw-surface);color:var(--bw-muted);font-size:.72rem;font-weight:650;user-select:none;-webkit-user-select:none}
.atlas-board .view-switch .view-toggle:focus-visible+span{outline:2px solid var(--bw-accent);outline-offset:2px}
.atlas-board .view-switch .view-toggle:checked+span{border-color:var(--bw-accent);color:var(--bw-accent)}
.atlas-board .lanes:focus-visible{outline:2px solid var(--bw-accent);outline-offset:-2px}
@supports selector(:has(*)){.atlas-board .view-switch{display:inline-flex}.atlas-board .view-switch:has(.view-toggle:checked)~.lanes{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(12.5rem,15rem);overflow-x:auto;align-items:stretch;padding-bottom:.45rem}.atlas-board .view-switch:has(.view-toggle:checked)~.lanes .lane{min-height:9rem}}
html,body{margin:0}
details.diagnostics{margin:.35rem 0 .6rem;color:var(--bw-muted);font-size:.78rem}
details.diagnostics summary{cursor:pointer}
.empty.error{color:#b53f3b}
</style>
</head>
<body>
<div id="root" class="atlas-board"><p class="board-note">Waiting for host tool result…</p></div>
<script>
(function () {
  var root = document.getElementById("root");
  var pendingInit = 1;
  var alive = true;
  function text(el, value) {
    el.textContent = value == null ? "" : String(value);
  }
  function post(msg) {
    if (!window.parent || window.parent === window) return;
    window.parent.postMessage(msg, "*");
  }
  function isRPC(msg) {
    return msg && typeof msg === "object" && msg.jsonrpc === "2.0";
  }
  function sendRequest(method, params, id) {
    post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
  }
  function sendNotify(method, params) {
    post({ jsonrpc: "2.0", method: method, params: params || {} });
  }
  function reply(id, result) {
    post({ jsonrpc: "2.0", id: id, result: result || {} });
  }
  function notifySize() {
    var doc = document.documentElement;
    var body = document.body;
    var width = 0;
    var height = 0;
    if (doc) {
      width = doc.clientWidth || doc.scrollWidth || 0;
      height = doc.scrollHeight || doc.clientHeight || 0;
    }
    if (body) {
      if (!width) width = body.scrollWidth || 0;
      if (!height) height = body.scrollHeight || 0;
    }
    sendNotify("ui/notifications/size-changed", { width: width, height: height });
  }
  function applyHostContext(ctx) {
    if (!ctx || typeof ctx !== "object") return;
    var scheme = ctx.theme;
    if (scheme === "dark" || scheme === "light") {
      document.documentElement.setAttribute("data-theme", scheme);
    }
    var container = ctx.containerDimensions && typeof ctx.containerDimensions === "object" ? ctx.containerDimensions : null;
    var width = container && (container.width || container.maxWidth);
    if (typeof width === "number" && isFinite(width) && width > 0) {
      document.documentElement.setAttribute("data-container-width", String(width));
      if (width <= 390) document.documentElement.setAttribute("data-container-narrow", "1");
      else document.documentElement.removeAttribute("data-container-narrow");
    }
  }
  function boardFrom(data) {
    if (!data || typeof data !== "object") return null;
    var body = data;
    if (data.structuredContent && typeof data.structuredContent === "object") body = data.structuredContent;
    if (body.payload && typeof body.payload === "object") body = body.payload;
    if (body.payload && typeof body.payload === "object" && body.payload.board) body = body.payload;
    if (body.board && typeof body.board === "object") return body.board;
    if (Array.isArray(body.columns)) return body;
    return null;
  }
  function backupLine(backup) {
    if (!backup || typeof backup !== "object") return "";
    var parts = [];
    if (backup.automatic_enabled) parts.push("automatic checkpoints");
    else if (backup.configured === false || backup.automatic_enabled === false) parts.push("local checkpoints off");
    if (backup.last_local_checkpoint_id) parts.push("local checkpoint present");
    if (backup.unbacked_event_count) parts.push(String(backup.unbacked_event_count) + " unbacked events");
    if (backup.verified_remote) parts.push("remote verified");
    if (backup.last_error_class) parts.push(String(backup.last_error_class));
    return parts.join(" · ");
  }
  function diagnosticNotes(board) {
    var notes = [];
    if (board && Array.isArray(board.notes)) notes = notes.concat(board.notes);
    if (board && board.backup && Array.isArray(board.backup.notes)) notes = notes.concat(board.backup.notes);
    return notes.filter(function (n) { return n && String(n).trim(); });
  }
  function countPhrase(board) {
    var total = board.total_cards || 0;
    var shown = board.shown_cards || 0;
    if (board.truncated && shown !== total) return "showing " + shown + " of " + total + " tickets";
    if (total === 1) return "1 ticket";
    return String(total) + " tickets";
  }
  function showMessage(msg, cls) {
    root.replaceChildren();
    var p = document.createElement("p");
    p.className = cls || "empty";
    text(p, msg);
    root.appendChild(p);
    notifySize();
  }
  function toolResultError(params) {
    if (!params || typeof params !== "object") return "";
    if (params.isError !== true && params.is_error !== true) return "";
    var content = params.content;
    if (Array.isArray(content)) {
      for (var i = 0; i < content.length; i++) {
        if (content[i] && content[i].text) return String(content[i].text);
      }
    }
    var structured = params.structuredContent;
    if (structured && structured.error) {
      var err = structured.error;
      if (typeof err === "string") return err;
      if (err && err.message) return String(err.message);
    }
    return "Tool failed";
  }
  function element(tag, className, value) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (value != null) text(node, value);
    return node;
  }
  function pill(parent, value, kind) {
    parent.appendChild(element("span", "pill" + (kind ? " " + kind : ""), value));
  }
  function detailRow(parent, label, value) {
    parent.appendChild(element("dt", "", label));
    parent.appendChild(element("dd", "", value || "None recorded"));
  }
  function renderCard(card) {
    var article = document.createElement("article");
    var disclosure = element("details", "card");
    var summary = document.createElement("summary");
    summary.appendChild(element("span", "card-id", card.id || ""));
    summary.appendChild(element("span", "card-title", card.title || "(untitled)"));
    var meta = element("span", "card-meta");
    var priority = card.priority || "low";
    var priorityLabel = card.priority ? priority.replace(/_/g, " ") + " priority" : "No priority";
    var safePriority = /^(critical|high|medium|low)$/.test(priority) ? priority : "low";
    var dot = element("span", "priority-dot priority-" + safePriority);
    dot.setAttribute("aria-hidden", "true");
    meta.appendChild(dot);
    meta.appendChild(element("span", "", priorityLabel));
    summary.appendChild(meta);
    var pills = element("span", "card-pills");
    if (card.type) pill(pills, card.type, "pill-type");
    if (Array.isArray(card.labels)) card.labels.forEach(function (label) { pill(pills, label, ""); });
    summary.appendChild(pills);
    if (Array.isArray(card.blocked_by) && card.blocked_by.length) {
      var blockers = element("span", "card-blockers");
      card.blocked_by.forEach(function (id) { pill(blockers, "Blocked by " + id, "pill-blocked"); });
      summary.appendChild(blockers);
    }
    disclosure.appendChild(summary);
    var detail = element("div", "card-detail");
    if (card.description && String(card.description).trim()) {
      detail.appendChild(element("h3", "", "Description"));
      detail.appendChild(element("p", "", String(card.description).trim()));
    }
    if (Array.isArray(card.acceptance_criteria) && card.acceptance_criteria.length) {
      detail.appendChild(element("h3", "", "Acceptance criteria"));
      var criteria = document.createElement("ul");
      card.acceptance_criteria.forEach(function (item) { criteria.appendChild(element("li", "", item)); });
      detail.appendChild(criteria);
    }
    detail.appendChild(element("h3", "", "Relations and review"));
    var relations = document.createElement("dl");
    detailRow(relations, "Assignee", card.assignee);
    detailRow(relations, "Reviewer", card.reviewer);
    detailRow(relations, "Review state", card.review_state);
    if (card.parent) detailRow(relations, "Parent", card.parent);
    if (Array.isArray(card.blocked_by) && card.blocked_by.length) detailRow(relations, "Blocked by", card.blocked_by.join(", "));
    if (Array.isArray(card.blocks) && card.blocks.length) detailRow(relations, "Blocks", card.blocks.join(", "));
    detail.appendChild(relations);
    disclosure.appendChild(detail);
    article.appendChild(disclosure);
    return article;
  }
  function render(data) {
    root.replaceChildren();
    var board = boardFrom(data);
    if (!board || typeof board !== "object") {
      showMessage("No board payload", "empty");
      return;
    }
    var heading = element("header", "board-heading");
    var titleBlock = document.createElement("div");
    titleBlock.appendChild(element("span", "board-eyebrow", "Atlas Tasker / Board"));
    titleBlock.appendChild(element("h1", "", board.title || "Board"));
    heading.appendChild(titleBlock);
    heading.appendChild(element("span", "board-total", countPhrase(board)));
    root.appendChild(heading);
    if (board.truncated) root.appendChild(element("p", "board-note", "Showing a partial board. Use a project filter or page through the remaining tickets."));
    if (Array.isArray(board.attention) && board.attention.length) root.appendChild(element("p", "board-note", "Attention: " + board.attention.join("; ")));
    if (Array.isArray(board.next_actions) && board.next_actions.length) root.appendChild(element("p", "board-note", "Next: " + board.next_actions[0]));
    var backup = backupLine(board.backup);
    if (backup) root.appendChild(element("p", "board-note", "Backup: " + backup));
    var extras = diagnosticNotes(board);
    if (extras.length) {
      var details = document.createElement("details");
      details.className = "diagnostics";
      var summary = document.createElement("summary");
      text(summary, "Diagnostics");
      details.appendChild(summary);
      extras.forEach(function (note) {
        var n = document.createElement("p");
        n.className = "note";
        text(n, note);
        details.appendChild(n);
      });
      root.appendChild(details);
    }
    var viewSwitch = element("label", "view-switch");
    var viewToggle = element("input", "view-toggle");
    viewToggle.setAttribute("type", "checkbox");
    viewToggle.setAttribute("checked", "");
    viewToggle.addEventListener("change", notifySize);
    viewSwitch.appendChild(viewToggle);
    viewSwitch.appendChild(element("span", "", "Side-scroll lanes"));
    root.appendChild(viewSwitch);
    var lanes = document.createElement("div");
    lanes.className = "lanes";
    lanes.setAttribute("role", "region");
    lanes.setAttribute("aria-label", "Board lanes");
    lanes.setAttribute("tabindex", "0");
    var columns = Array.isArray(board.columns) ? board.columns : [];
    columns.forEach(function (col) {
      if (!col || (col.status === "canceled" && !col.total)) return;
      var section = element("section", "lane lane-" + (col.status || ""));
      section.setAttribute("aria-label", col.label || col.status || "lane");
      var laneHead = element("div", "lane-head");
      laneHead.appendChild(element("h2", "", col.label || col.status || "Lane"));
      var count = element("span", "lane-count", String(col.total || 0));
      count.setAttribute("aria-label", String(col.total || 0) + ((col.total || 0) === 1 ? " ticket" : " tickets"));
      laneHead.appendChild(count);
      section.appendChild(laneHead);
      var list = element("div", "lane-list");
      var cards = Array.isArray(col.cards) ? col.cards : [];
      cards.forEach(function (card) {
        if (card && typeof card === "object") list.appendChild(renderCard(card));
      });
      if (!cards.length) list.appendChild(element("p", "lane-empty", "No tickets"));
      section.appendChild(list);
      lanes.appendChild(section);
    });
    root.appendChild(lanes);
    notifySize();
  }
  window.addEventListener("message", function (event) {
    if (!alive) return;
    if (event.source !== window.parent) return;
    var message = event.data;
    if (!isRPC(message)) return;
    if (pendingInit != null && message.id === pendingInit && !message.method) {
      if (message.error) {
        pendingInit = null;
        var fail = "Host initialize failed";
        if (message.error.message) fail = String(message.error.message);
        showMessage(fail, "empty error");
        return;
      }
      if (!message.result || typeof message.result !== "object") return;
      if (message.result.protocolVersion !== "2026-01-26") {
        pendingInit = null;
        showMessage("Unsupported host protocol", "empty error");
        return;
      }
      if (message.result.hostContext) applyHostContext(message.result.hostContext);
      pendingInit = null;
      sendNotify("ui/notifications/initialized", { protocolVersion: "2026-01-26" });
      notifySize();
      return;
    }
    if (message.method === "ping" && message.id != null) {
      reply(message.id, {});
      return;
    }
    if (message.method === "ui/resource-teardown" && message.id != null) {
      reply(message.id, {});
      alive = false;
      showMessage("App closed", "empty");
      return;
    }
    if (message.method === "ui/notifications/host-context-changed") {
      applyHostContext(message.params || {});
      notifySize();
      return;
    }
    if (message.method === "ui/notifications/tool-cancelled") {
      showMessage("Tool cancelled", "empty");
      return;
    }
    if (message.method === "ui/notifications/tool-result") {
      var params = message.params || {};
      var errText = toolResultError(params);
      if (errText) {
        showMessage(errText, "empty error");
        return;
      }
      render(params);
    }
  });
  sendRequest("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "atlas-board", version: "1.15" },
    appCapabilities: {}
  }, pendingInit);
})();
</script>
</body>
</html>
