  <rect x="3" y="6" width="650" height="116" rx="18" fill="url(#frame)" stroke="#2f5CB8" stroke-width="3"/>
  <rect x="3" y="6" width="650" height="116" rx="18" fill="none" stroke="#7fb2ff" stroke-opacity="0.14" stroke-width="1" transform="translate(0 -1.5)"/>
